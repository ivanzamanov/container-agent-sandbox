name: agent-sandbox
services:
  claude:
    userns_mode: keep-id
    image: docker.io/library/container-agent-sandbox
    init: true
    volumes:
      - $PWD/opencode/.local/share:/home/agent/.local/share/opencode:rw,z
      - $PWD/opencode/.local/state:/home/agent/.local/state/opencode:rw,z
      - $PWD/dot-config:/home/agent/.config/:rw,z
      - $PWD/dot-botctl:/home/agent/.botctl/:rw,z
      - $PWD/dot-claude:/home/agent/.claude/:rw,z
      - $PWD/dot-claude.json:/home/agent/.claude.json:rw,z
      - $PWD/src/mise-config.toml:/home/agent/.config/mise/config.toml:rw,z
      - $PWD/workspace:/home/agent/workspace:rw,z
    environment:
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      NO_PROXY: localhost,127.0.0.1
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      no_proxy: localhost,127.0.0.1
    depends_on:
      - squid
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    networks:
      - sandbox
    ports:
      - 4444:4444 # opencode
      - 4445:4445 # vite dev server
      - 8082:8082 # zellij
  squid:
    image: ubuntu/squid:latest
    volumes:
      - $PWD/src/squid.conf:/etc/squid/squid.conf:ro,z
    networks:
      - sandbox
      - internet
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - sandbox
networks:
  sandbox:
    internal: true
  internet:
