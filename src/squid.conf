# Minimal squid config for the agent-sandbox proxy.
# Only the `sandbox` container (on the internal `agent` network) can reach
# this proxy; this only trims what it's allowed to do once it does.

http_port 3128

# Only allow plain HTTP and CONNECT-tunneled HTTPS out.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Block requests aimed at internal/private address space (other Docker
# services, the host, loopback, link-local/cloud-metadata) — the agent
# should only reach the public internet through this proxy, never pivot
# to other internal services. This must come before any general allow
# rule, or a source-based allow would short-circuit it.
acl localnetdst dst 10.0.0.0/8
acl localnetdst dst 172.16.0.0/12
acl localnetdst dst 192.168.0.0/16
acl localnetdst dst 127.0.0.0/8
acl localnetdst dst 169.254.0.0/16

http_access deny localnetdst
http_access allow all

# No disk cache — this container is ephemeral.
cache deny all

# Log to stdout so `docker compose logs proxy` shows requests.
access_log stdio:/dev/stdout squid

coredump_dir /var/spool/squid
